version: "3"

includes:
  deps:
    internal: true
    taskfile: "deps.yaml"
  utils:
    internal: true
    taskfile: "../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

tasks:
  build-debug:
    vars:
      BUILD_DIR: "{{.G_LOG_SURGEON_FFI_DEBUG_BUILD_DIR}}"
    deps:
      - task: "generate"
        vars:
          BUILD_DIR: "{{.BUILD_DIR}}"
          BUILD_TYPE: "debug"
    cmds:
      - task: "utils:cmake:build"
        vars:
          BUILD_DIR: "{{.BUILD_DIR}}"

  build-release:
    vars:
      BUILD_DIR: "{{.G_LOG_SURGEON_FFI_RELEASE_BUILD_DIR}}"
    deps:
      - task: "generate"
        vars:
          BUILD_DIR: "{{.BUILD_DIR}}"
          BUILD_TYPE: "release"
    cmds:
      - task: "utils:cmake:build"
        vars:
          BUILD_DIR: "{{.BUILD_DIR}}"

  clean-debug:
    cmds:
      - task: "utils:cmake:clean"
        vars:
          BUILD_DIR: "{{.G_LOG_SURGEON_FFI_DEBUG_BUILD_DIR}}"

  clean-release:
    cmds:
      - task: "utils:cmake:clean"
        vars:
          BUILD_DIR: "{{.G_LOG_SURGEON_FFI_RELEASE_BUILD_DIR}}"

  generate:
    internal: true
    requires:
      vars:
        - "BUILD_DIR"
        - "BUILD_TYPE"
    deps:
      - "deps:install-all"
    cmds:
      - task: "utils:cmake:generate"
        vars:
          BUILD_DIR: "{{.BUILD_DIR}}"
          EXTRA_ARGS:
            - "-DCMAKE_BUILD_TYPE={{.BUILD_TYPE}}"
          SOURCE_DIR: "{{.ROOT_DIR}}"
